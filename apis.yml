name: Mainstay
description: Mainstay (formerly AdmitHub) is a student engagement platform for higher
  education that delivers human-centered, AI-enhanced conversational coaching to students
  via SMS text messaging, live chat, web chat, and social messaging. Grounded in behavioral
  science research, its two-way messaging assistant nudges students through enrollment,
  registration, financial aid, and academic milestones while giving institutional
  staff insights and tools to improve engagement, persistence, and outcomes. Mainstay
  is a Techstars portfolio company. It publishes an API-token authenticated REST API
  (v1.0, base URL https://api.admithub.com) documented at docs.api.mainstay.com, used
  to sync student and employee records and engagement data between Mainstay and external
  systems; tokens are generated from the Mainstay dashboard and presented as Bearer
  credentials.
